open_questions:
  - Which Apple home hub and iCloud+ tier are already available?
  - Do the intended positions have USB power and adequate 2.4 GHz Wi-Fi; is pan/tilt needed?
  - For outside, is automatic light enough or are person notifications/video required?
  - Is roughly 1,000 SEK still the outdoor-light budget, and should Apple Home control be included?
