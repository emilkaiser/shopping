research_brief:
  original_input: I think my need is a decent to good floodlight solution and two indoor himekit camera.
  objectives:
    - Compare two fixed indoor cameras with a pan/tilt alternative
    - Verify native Apple Home/HKSV, power and iCloud/home-hub requirements
    - Keep outdoor floodlighting separate from indoor camera selection
