monitoring:
  enabled: true
  type: opportunity
  trigger: "Notify when a reputable Swedish/EU seller offers an Ultra 2 materially below 4,500 SEK, an Ultra 3 around 6,000 SEK or lower, or another deal that is clearly stronger after normalizing generation, condition, battery health, warranty, returns, shipping, and Swedish cellular compatibility."
  notes: "Check reputable Swedish/EU refurb/used sellers. Alert only on decision-changing deals or meaningful price drops. Do not report routine observations. Current Ultra 2 reference is 4,880 SEK at reNewed (2026-10-06), temporarily out of stock, min 80% battery health, 2-year warranty and 30-day return."

current_recommendation:
  candidate_id: apple-watch-ultra-2
  action: wait
  rationale: "Ultra 2 is the current value leader, but 4,880 SEK with only an 80% minimum battery guarantee is not strong enough to rush. Wait for <4,500 SEK, a better battery-health unit, or an Ultra 3 near 6,000 SEK."
