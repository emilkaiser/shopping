schema_version: 1
id: apple-watch-ultra
title: Apple Watch Ultra
status: waiting
created_at: 2026-10-05
updated_at: 2026-10-06
currency: SEK

goal: "Replace Garmin Fenix 6 Pro with a substantial, sporty Apple Watch that improves smartwatch functionality without giving up too much sports utility."

research_brief:
  original_input: "Compare Apple Watch Ultra generations, especially refurbished previous generations, and find the best value for replacing a Garmin Fenix 6 Pro."
  objectives:
    - Compare Ultra 2, Ultra 3, and Ultra 4 on meaningful real-world differences
    - Find cheaper/refurbished alternatives that preserve most of the benefit
    - Identify whether paying more materially improves the experience
    - Include review and owner-feedback evidence in the decision
  challenge_assumptions:
    - The newest generation is automatically the best choice
    - Apple Watch Ultra is necessarily a better fit than staying with a Garmin-style sports watch
  research_depth: standard

constraints:
  must:
    - Cellular connectivity compatible with Sweden
    - Large/substantial watch presence
    - Strong everyday smartwatch experience
  prefer:
    - Refurbished or used if value is clearly better
    - Good battery life
    - Good sports and workout tracking
    - Strong resale value
    - Battery health around 90% or better when individually stated
    - Reputable Swedish/EU seller with meaningful warranty and return rights
  avoid:
    - Paying a large premium for small generation-to-generation gains
    - Small-looking watch
    - Weak or unclear battery condition on refurbished units unless price compensates
    - Region-specific cellular variants that are not suitable for Sweden
  budget:
    max: null
  deadline: null
  region: Sweden

criteria:
  - name: price_value
    weight: 5
  - name: smartwatch_features
    weight: 5
  - name: battery
    weight: 4
  - name: sports_tracking
    weight: 4
  - name: fit_and_aesthetics
    weight: 4
  - name: refurb_quality_warranty
    weight: 4

open_questions:
  - Does Ultra 4's new health sensing, readiness, and battery life justify its premium?
  - Which generation is the current value sweet spot as refurb prices move?
  - Which strap is best for sport and everyday wear?

