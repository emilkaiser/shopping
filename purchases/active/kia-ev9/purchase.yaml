schema_version: 1
id: kia-ev9
title: Kia EV9 / seven-seat EV
status: waiting
created_at: 2026-10-07
updated_at: 2026-10-07
currency: SEK
goal: Compare a used seven-seat Kia EV9 with other seven-seat EVs, new/demo offers and leasing on
  equivalent total cost.
research_brief:
  original_input: KIA EV9, ID Buzz 7-sitsig. Vilka andra 7-sitsiga elbilar finns? Och hur ska jag
    tänka kring köpa nytt/begsgnst (och finansiering) eller leasing?
  objectives:
    - Migrate prior seven-seat comparison, EV9 used-price/mileage guidance and monitoring intent
    - Compare used EV9 AWD/Plus/GT-Line with new/demo, IONIQ 9 and ID. Buzz LWB
    - Compare purchase/finance and leasing over the same period and distance without double-counting
      interest
    - Verify exact seats, history, warranty, condition and delivered price for every listing
  challenge_assumptions:
    - Six-seat GT-Line is an acceptable substitute for seven seats
    - A low monthly payment means low total cost
    - Historical target prices or assistant estimates are current market valuations
    - An estimated residual value guarantees a future buyback
  research_depth: standard
constraints:
  must:
    - Battery electric
    - Seven seats; verify the exact vehicle configuration
  prefer:
    - Used dealer car with documented history and remaining manufacturer warranty
    - EV9 AWD/Plus/GT-Line as prior research focus; AWD not confirmed as a hard requirement
    - Good third-row access and luggage practicality
  avoid: []
  budget:
    max: null
  deadline: null
  region: Sweden
criteria:
  - name: seven_seat_practicality
    weight: 5
  - name: total_ownership_cost
    weight: 5
  - name: history_warranty_condition
    weight: 5
  - name: charging_and_trip_fit
    weight: 4
  - name: price_mileage_value
    weight: 4
open_questions:
  - What are annual driving distance, ownership horizon and cash/deposit budget?
  - How often will all seven seats and luggage space be needed together?
  - Is AWD required, and are there towing, parking or charging constraints?
  - Which new/demo, loan and leasing quotes apply to the same specification and mileage?
  - Does the prior daily ChatGPT monitor still run, and what is its schedule/automation identifier?
