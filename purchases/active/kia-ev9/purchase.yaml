monitoring:
  enabled: true
  type: opportunity
  trigger: "Preserve prior targets: Swedish dealer used 2024 EV9 AWD/GT-Line, seven seats, roughly
    4,000–5,500 mil (40,000–55,000 km), below 650,000 SEK; or seven-seat Plus/AWD around
    610,000–630,000 SEK with comparable or lower mileage. Notify only on a new or meaningfully
    changed qualifying opportunity after fees, history, warranty and condition checks."
  notes: Imported intent from prior chat; not proof of an active repo scheduler. Earlier daily ChatGPT
    monitoring was reported, but schedule/ID and current status were not verified or changed.
    Exclude six-seat cars, unknown seat counts, materially different trims and unnormalized
    high-mileage offers. Suppress unchanged/non-actionable listings. Targets are prior assistant
    heuristics, not user-approved hard budget limits; review against fresh market quotes.
current_recommendation:
  candidate_id: ev9-used-awd-seven
  action: wait
  rationale: Retain used seven-seat EV9 as the provisional shortlist and historical opportunity
    targets. The checked 699,900 SEK GT-Line is above target; this single sample cannot establish
    that the whole market has no deals. Compare matched new/demo and IONIQ 9/ID. Buzz quotes before
    committing.
